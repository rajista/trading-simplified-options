services:
  - type: web
    name: trading-simplified-options
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NIFTY_LOT_SIZE
        value: "65"
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: STALE_CACHE_SECONDS
        value: "900"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: MARKET_EVENTS_JSON
        value: "[]"
      - key: CORS_ORIGINS
        value: https://options.trading-simplified.com
      - key: GEMINI_API_KEY
        sync: false
